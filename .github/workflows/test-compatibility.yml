name: Test Keystone compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compatibility:
    name: Keystone ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "2024.1"
            ref: unmaintained/2024.1
          - release: "2025.1"
            ref: stable/2025.1
          - release: "2025.2"
            ref: stable/2025.2
          - release: "2026.1"
            ref: stable/2026.1

    steps:
      - name: Check out keystone-rxt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out Keystone ${{ matrix.release }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openstack/keystone
          ref: ${{ matrix.ref }}
          path: .keystone

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test environment
        run: |
          python -m pip install pytest==8.3.5
          python -m pip install --editable ./.keystone --editable .

      - name: Run compatibility tests
        run: python -m pytest tests/ -v
